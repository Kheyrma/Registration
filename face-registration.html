<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Registration System</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
:root{--bg:#eef1ee;--ink:#1b2a2f;--mute:#5d6b6f;--line:#cfd7d3;--card:#fbfcfb;--acc:#0f6b78;--acc-ink:#fff;--bad:#b3402a;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#121a1c;--ink:#e6eeee;--mute:#93a3a6;--line:#2a393c;--card:#182326;--acc:#4fb3c2;--acc-ink:#0b1416;--bad:#e0735c;--ok:#5cc38a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 18px}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav button{background:none;border:0;padding:10px 14px;font:inherit;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc);font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cam{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3;max-width:480px}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row{display:grid;gap:12px;margin:14px 0}
label{display:grid;gap:4px;font-weight:600}
input[type=text],input[type=tel]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.chk{display:flex;gap:10px;font-weight:400;align-items:flex-start}
.btn{font:inherit;font-weight:600;padding:11px 18px;border-radius:8px;border:0;background:var(--acc);color:var(--acc-ink);cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);min-height:44px}
.msg.ok{border-color:var(--ok)}.msg.bad{border-color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:.95rem}
.scroll{overflow-x:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Member face registration</h1>
<p class="sub">Register members by face scan, then check them in by looking at the camera.</p>
<nav role="tablist">
<button role="tab" aria-selected="true" data-tab="reg">Register</button>
<button role="tab" aria-selected="false" data-tab="chk">Check in</button>
<button role="tab" aria-selected="false" data-tab="mem">Members</button>
</nav>

<section id="reg">
<div class="cam"><video id="v1" autoplay muted playsinline></video><canvas id="c1"></canvas></div>
<div class="row">
<label>Full name<input type="text" id="name" autocomplete="off"></label>
<label>Phone or member ID<input type="tel" id="pid" autocomplete="off"></label>
<label class="chk"><input type="checkbox" id="consent"><span>The member agrees to have their face scanned and stored for registration and check-in.</span></label>
</div>
<div class="bar"><button class="btn" id="regBtn" disabled>Scan and register</button></div>
<div class="msg" id="regMsg" role="status">Loading face models…</div>
</section>

<section id="chk" hidden>
<div class="cam"><video id="v2" autoplay muted playsinline></video><canvas id="c2"></canvas></div>
<div class="bar"><button class="btn" id="scanBtn" disabled>Start scanning</button><button class="btn alt" id="stopBtn" hidden>Stop</button></div>
<div class="msg" id="chkMsg" role="status">Press Start scanning.</div>
<h2 style="font-size:1.1rem;margin-top:22px">Today’s check-ins</h2>
<div class="scroll"><table><thead><tr><th>Name</th><th>Time</th></tr></thead><tbody id="log"></tbody></table></div>
</section>

<section id="mem" hidden>
<div class="bar"><button class="btn alt" id="csv">Export CSV</button></div>
<div class="scroll"><table><thead><tr><th>Name</th><th>ID</th><th>Registered</th><th></th></tr></thead><tbody id="list"></tbody></table></div>
<p class="sub" id="empty" hidden>No members registered yet.</p>
</section>
</main>

<script>
const MODELS="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";
const THRESH=0.5, DUP=0.45;
const $=id=>document.getElementById(id);
let members=[], attendance=[], ready=false, stream=null, scanTimer=null;

function load(){try{members=JSON.parse(localStorage.getItem("fr_members")||"[]");attendance=JSON.parse(localStorage.getItem("fr_att")||"[]")}catch(e){members=[];attendance=[]}}
function save(){try{localStorage.setItem("fr_members",JSON.stringify(members));localStorage.setItem("fr_att",JSON.stringify(attendance))}catch(e){alert("Could not save data in this browser.")}}
function say(el,t,c){el.textContent=t;el.className="msg"+(c?" "+c:"")}

const opts=()=>new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5});
async function detect(video){return faceapi.detectSingleFace(video,opts()).withFaceLandmarks().withFaceDescriptor()}

async function init(){
  load();render();
  try{
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)]);
    ready=true;say($("regMsg"),"Ready. Start the camera by filling the form.");
    refreshBtns();startCam($("v1"));
  }catch(e){say($("regMsg"),"Could not load face models. Check your internet connection and reload.","bad")}
}
async function startCam(v){
  if(v.srcObject)return;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:640,height:480}});v.srcObject=stream}
  catch(e){say($("regMsg"),"Camera blocked. Allow camera access (the page must be on HTTPS or localhost).","bad")}
}
function stopCam(v){if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}}
function refreshBtns(){
  $("regBtn").disabled=!(ready&&$("name").value.trim()&&$("pid").value.trim()&&$("consent").checked);
  $("scanBtn").disabled=!ready;
}
["name","pid","consent"].forEach(i=>$(i).addEventListener("input",refreshBtns));

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["reg","chk","mem"].forEach(s=>$(s).hidden=(s!==b.dataset.tab));
  stopScan();stopCam($("v1"));stopCam($("v2"));
  if(b.dataset.tab==="reg"&&ready)startCam($("v1"));
  if(b.dataset.tab==="mem")render();
});

$("regBtn").onclick=async()=>{
  const btn=$("regBtn");btn.disabled=true;
  const samples=[];
  for(let i=0;i<3;i++){
    say($("regMsg"),`Scanning… look at the camera (${i+1}/3)`);
    let d=null;
    for(let t=0;t<15&&!d;t++){d=await detect($("v1"));if(!d)await new Promise(r=>setTimeout(r,250))}
    if(!d){say($("regMsg"),"No face found. Face the camera in good light and try again.","bad");refreshBtns();return}
    samples.push(d.descriptor);
    await new Promise(r=>setTimeout(r,400));
  }
  const avg=new Float32Array(128);
  samples.forEach(s=>s.forEach((x,k)=>avg[k]+=x/3));
  if(members.length){
    const m=new faceapi.FaceMatcher(members.map(p=>new faceapi.LabeledFaceDescriptors(p.id,[new Float32Array(p.desc)])),DUP);
    const r=m.findBestMatch(avg);
    if(r.label!=="unknown"){const p=members.find(x=>x.id===r.label);say($("regMsg"),`This face is already registered as ${p.name}.`,"bad");refreshBtns();return}
  }
  const id=$("pid").value.trim();
  if(members.some(p=>p.id===id)){say($("regMsg"),"That ID is already used by another member.","bad");refreshBtns();return}
  members.push({id,name:$("name").value.trim(),desc:Array.from(avg),date:new Date().toISOString()});
  save();
  say($("regMsg"),`${$("name").value.trim()} registered.`,"ok");
  $("name").value="";$("pid").value="";$("consent").checked=false;refreshBtns();
};

function stopScan(){clearInterval(scanTimer);scanTimer=null;$("scanBtn").hidden=false;$("stopBtn").hidden=true}
$("scanBtn").onclick=async()=>{
  if(!members.length){say($("chkMsg"),"No members registered yet.","bad");return}
  await startCam($("v2"));
  const matcher=new faceapi.FaceMatcher(members.map(p=>new faceapi.LabeledFaceDescriptors(p.id,[new Float32Array(p.desc)])),THRESH);
  $("scanBtn").hidden=true;$("stopBtn").hidden=false;say($("chkMsg"),"Scanning…");
  let busy=false;
  scanTimer=setInterval(async()=>{
    if(busy)return;busy=true;
    try{
      const d=await detect($("v2"));
      if(!d){say($("chkMsg"),"Scanning… no face in view.")}
      else{
        const r=matcher.findBestMatch(d.descriptor);
        if(r.label==="unknown"){say($("chkMsg"),"Face not recognised. Register this member first.","bad")}
        else{
          const p=members.find(x=>x.id===r.label);
          const today=new Date().toDateString();
          const already=attendance.some(a=>a.id===p.id&&new Date(a.time).toDateString()===today);
          if(already)say($("chkMsg"),`${p.name} has already checked in today.`,"ok");
          else{attendance.push({id:p.id,name:p.name,time:new Date().toISOString()});save();say($("chkMsg"),`Welcome, ${p.name}. Checked in.`,"ok");render()}
        }
      }
    }catch(e){}
    busy=false;
  },700);
};
$("stopBtn").onclick=()=>{stopScan();say($("chkMsg"),"Stopped.")};

function render(){
  const tb=$("list");tb.innerHTML="";
  members.forEach(p=>{
    const tr=document.createElement("tr");
    [p.name,p.id,new Date(p.date).toLocaleDateString()].forEach(t=>{const td=document.createElement("td");td.textContent=t;tr.appendChild(td)});
    const td=document.createElement("td");const b=document.createElement("button");b.className="btn alt";b.textContent="Delete";
    b.onclick=()=>{if(confirm("Delete "+p.name+" and their face data?")){members=members.filter(x=>x.id!==p.id);save();render()}};
    td.appendChild(b);tr.appendChild(td);tb.appendChild(tr);
  });
  $("empty").hidden=members.length>0;
  const lg=$("log");lg.innerHTML="";
  const today=new Date().toDateString();
  attendance.filter(a=>new Date(a.time).toDateString()===today).reverse().forEach(a=>{
    const tr=document.createElement("tr");
    [a.name,new Date(a.time).toLocaleTimeString()].forEach(t=>{const td=document.createElement("td");td.textContent=t;tr.appendChild(td)});
    lg.appendChild(tr);
  });
}
$("csv").onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[["Name","ID","Registered"],...members.map(p=>[p.name,p.id,p.date])].map(r=>r.map(q).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows],{type:"text/csv"}));a.download="members.csv";a.click();
};
init();
</script>
</body>
</html>
